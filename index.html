<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Beautify, minify and validate JSON in your browser. Nothing is uploaded.">
  <meta name="color-scheme" content="light dark">
  <title>JSON Formatter</title>
  <script>
    // Set the theme before first paint: saved choice, else the system setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('json-formatter-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/json-tools.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="top-text">
      <h1>JSON Formatter</h1>
      <p>Beautify, minify and validate JSON. Everything runs in this page, so your data stays on your device.</p>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span class="icon" aria-hidden="true">&#x263E;&#xFE0E;</span></button>
  </header>

  <div class="toolbar" role="toolbar" aria-label="JSON actions">
    <div class="group">
      <button id="btnFormat" class="primary active" type="button" title="Beautify with indentation (Ctrl/Cmd + Enter)">Format</button>
      <button id="btnMinify" type="button" title="Remove all whitespace">Minify</button>
      <button id="btnValidate" type="button" title="Check the input and report any error">Validate</button>
    </div>
    <div class="group">
      <label class="field" for="indent">Indent
        <select id="indent">
          <option value="2" selected>2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <label class="check" for="sortKeys"><input type="checkbox" id="sortKeys"> Sort keys</label>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button id="btnSample" type="button">Load sample</button>
      <label class="file-btn" for="fileIn">Open file<input type="file" id="fileIn" accept=".json,application/json,text/plain"></label>
      <button id="btnClear" type="button">Clear</button>
    </div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" data-state="empty">
    <span class="pill">Ready</span><span class="msg">Paste JSON on the left to begin.</span>
  </div>

  <div class="panes">
    <section class="pane" aria-label="Input">
      <div class="pane-head">
        <label class="title" for="input">Input</label>
        <span id="inMeta" class="meta"></span>
      </div>
      <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" placeholder="Paste or type JSON here"></textarea>
    </section>
    <section class="pane" aria-label="Result">
      <div class="pane-head">
        <span class="title" id="outTitle">Formatted</span>
        <span id="outMeta" class="meta"></span>
        <div class="actions">
          <button id="btnCopy" type="button">Copy</button>
          <button id="btnUse" type="button" title="Replace the input with this result">Use as input</button>
        </div>
      </div>
      <pre id="output" tabindex="0" aria-labelledby="outTitle"><code id="outCode"></code></pre>
    </section>
  </div>
</main>
</body>
</html>
