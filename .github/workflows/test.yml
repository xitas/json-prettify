name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install test-only dependencies
        run: npm ci
      - name: Download the JSON Schema Test Suite (test fixture, not committed)
        run: npm run schema-suite
      - name: Run unit tests
        run: node --test
